<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Task Board</title>
</head>
<body>
    <div class="container">
    <h2 class="hero" id="title">TASK BOARD</h2>
    <p id="line">This is a simple Task Board app.<br> It is uses to add task with its marking</p>
    <form class="formtext">
        <label for="taskname" class="formtext" id="label">Task Name:</label><br>
        <input type="text" name="tname" id="textarea"><br>
        <label for="priority" id="label">Priority:</label><br>
        <select name="priority" class="formtext" id="prior">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select><br>
        <div class="btns">
        <button type="submit" class="btn" id="sub">Add</button>
        <button type="reset" class="btn" id="del">Reset</button>
        </div>
    </form>
    </div>
<div class="lists">
    
    <div>
        <input type="checkbox">
        <span>Install Node js.</span>
        <span class="high">~ <em>High</em></span>
        <button type="reset" class="btn"  id="del">Delete</button>
    </div>
    <div>
        <input type="checkbox">
        <span>Learn HTML</span>
        <span class="med">~ <em>Medium</em></span>
        <button type="reset" class="btn" id="del">Delete</button>
    </div>
    <div>
        <input type="checkbox">
        <span>Learn CSS</span>
        <span class="med">~ <em>Medium</em></span>
        <button type="reset" class="btn" id="del">Delete</button>
    </div>
    <div>
        <input type="checkbox">
        <span>Learn Tailwind Basics</span>
        <span class="low">~ <em>Low</em></span>
        <button type="reset" class="btn" id="del">Delete</button>
    </div>
    <div>
        <input type="checkbox">
        <span>Learn Javascript</span>
        <span class="med">~ <em>Medium</em></span>
        <button type="reset" class="btn" id="del">Delete</button>
    </div>
</div> 

<div class="statusbar">
    <div class="items">
        <p>Total Tasks</p>
        <span>5</span>
    </div>
    <div class="items">
        <p>Completed</p>
        <span>2</span>
    </div>
    <div class="items">
        <p>High Priority</p>
        <span>1</span>
    </div>
</div>
</body>
</html>
