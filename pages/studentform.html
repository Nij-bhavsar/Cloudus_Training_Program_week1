<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image" href="/images/logo.png">
    <title>Edunet - Online Learning Platform</title>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body>
    <nav class="flex items-center justify-between bg-white px-5 py-4 text-black p-2.5 sticky top-0 z-50 shadow-md">
        <a href="/pages/home.html" class="flex items-center">
            <img src="/images/edunet.png" alt="Edunet logo" class="h-12 w-70 object-contain">
            <!-- <a href="./home.html">Edunet - Online Learning Platform</a> -->
        </a>
        <div class="items-center space-x-6">
            <a href="./home.html" class="hover:text-indigo-600">Home</a>
            <a href="./courselisting.html" class="hover:text-indigo-600">Courses</a>
            <a href="./studentform.html" class="hover:text-indigo-600">Registration</a>
            <a href="./coursedetail.html" class="hover:text-indigo-600">About</a>
        </div>
            
        <div class="space-x-2 items-center">
            <input type="text" placeholder="Search" class="bg-gray-300 px-4 py-2 rounded-full">
            <button type="button" class="cursor-pointer bg-red-500 text-white px-4 py-2 rounded-full">Signup</button>
            <button type="button" class="cursor-pointer px-4 py-2 rounded-full bg-sky-500 text-white">Login</button>
        </div>
    </nav>
    <div class="flex p-6">
        <form class="mx-auto grid w-full max-w-3xl grid-cols-2 gap-5 rounded-lg bg-white p-8 shadow-md sm:grid-cols-2">
            <div class="col-span-2 text-center">
                <h2 class="ml-15 mb-4 text-3xl font-bold justify-center-safe">
                Student Registration
            </h2>
            </div>
            <div>
                <label for="name" class="mb-2 block">Name</label>
                <input type="text" id="name" placeholder="Enter your full name" class="w-full rounded border p-2">
            </div>

            <div>
                <label for="email" class="mb-2 block">Email</label>
                <input type="text" placeholder="Enter your email-id" class="w-full rounded border p-2">
            </div>
            
            <div>
                <label for="password" class="mb-2 block">Password</label>
                <input type="password" placeholder="Enter your password" class="w-full rounded border p-2">
            </div>
            
            <div>
                <label for="password" class="mb-2 block">Confirm Password</label>
                <input type="password" placeholder="Enter your existing password" class="w-full rounded border p-2">
            </div>
            <div>
                <label for="birthday" class="mb-2 block">Birthday</label>
                <input type="date" placeholder="Enter your Birthday" class="w-full rounded border p-2">
            </div>
            <div>
                <label for="adharcard" class="mb-2 block">Aadharcard No.</label>
                <input type="text" placeholder="Enter your Aadharcard no." class="w-full rounded border p-2">
            </div>
            
            <div>
                <!-- <label for="education" class="mb-2 block">Education Level</label> -->
                <select id="education" class="w-full rounded border p-2">
                    <option selected disabled>Education Level</option>
                    <option>UG</option>
                    <option>PG</option>
                    <option>10th/12th</option>
                    <option>Below 10th</option>
                </select>
            </div>
            
            <div>
                <!-- <label for="course" class="mb-2 block">Select Course</label> -->
                <select id="Courses" class="w-full rounded border p-2">
                    <option value="" selected disabled> Select Course</option>
                    <option>Angular Developer</option>
                    <option>Web Developer</option>
                    <option>Flutter Developer</option>
                    <option>Android Developer</option>
                    <option>IOS Developer</option>
                    <option>Laravel Developer</option>
                    <option>React Developer</option>
                    <option>Full Stack Developer</option>
                    <option>Python Developer</option>
                    <option>QA Tester</option>
                </select>
            </div>
            
            <div class="flex items-center ">
                <input type="checkbox">
                <label for="terms" class="pl-2">Terms & Condition apply</label>
            </div>
            
            <div class="FLEX items-center gap-3">
                <button type="submit" class="rounded border px-5 py-2 text-white cursor-pointer bg-amber-300">Submit</button>
                <button type="reset" class="cursor-pointer text-white rounded border px-5 p-2  bg-red-500">Reset</button>
            </div>
        </form>
    </div>
<footer class="bg-white text-center py-5 mt-12">
    <p class="text-gray-400 text-sm">
       © 2026 Edunet. All Rights Reserved.
    </p>
</footer>
</body>
</html>
